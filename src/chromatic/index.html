<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Chromatic. macOS menu bar app for color contrast accessibility.">
  <title>Chromatic — Color contrast accessibility</title>
  <link rel="canonical" href="https://andrewgioia.com/chromatic/">
  <link rel="icon" href="./app-icon.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .landing {
      /* The 2560 × 1600 image has its window centered horizontally,
         inside x=880…1680 and y=64…960 (including room for the shadow).
         Fit that region, reserving space below for the identity. */
      --image-width: min(1920px, calc((100vw - 48px) * 3.2), calc((max(100svh, 540px) - 190px) * 2.666667));
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
      min-height: max(100svh, 540px);
      overflow: hidden;
      background: #1a1a1a;
    }
    .scene {
      position: absolute;
      z-index: -1;
      width: var(--image-width);
      max-width: none;
      height: auto;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    .menu-bar {
      position: absolute;
      inset: 4px 0 auto;
      height: clamp(24px, calc(var(--image-width) * 0.022), 40px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-inline: clamp(12px, 2vw, 24px);
      pointer-events: none;
      font-size: clamp(11px, 1.2vw, 14px);
      line-height: 1;
    }
    .menu-bar img { display: block; height: 18px; width: auto; }
    .menu-bar .menu-brand { display: flex; align-items: center; gap: 12px; }
    .menu-bar .menu-icon { width: 18px; justify-self: center; }
    .menu-bar time { justify-self: end; white-space: pre; }
    .identity {
      position: relative;
      padding: calc(var(--image-width) * 0.375 + 24px + 2rem) 24px 40px;
      text-align: center;
      text-shadow: 0 2px 16px rgb(0 0 0 / 30%);
    }
    .brand { display: flex; justify-content: center; align-items: center; gap: 14px; }
    .brand img { width: 64px; height: 64px; }
    h1 { font-size: clamp(32px, 4vw, 42px); line-height: 1.15; letter-spacing: -0.035em; font-weight: 600; margin: 0; }
    p { max-width: 420px; margin: 12px auto 0; font-size: 16px; line-height: 1.5; text-wrap: balance; }
    footer {
      margin-top: auto;
      padding: 0 24px 2rem;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #d0d0d0;
    }
    footer a { color: inherit; text-underline-offset: 3px; }
    footer a:hover { color: #fff; }
    footer a:focus-visible { outline: 2px solid #aaffff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="landing">
    <img class="scene" src="./app.png" width="2560" height="1600" alt="Chromatic showing foreground and background colors, a live preview, and WCAG contrast results." fetchpriority="high">
    <div class="menu-bar" aria-hidden="true">
      <div class="menu-brand">
        <img src="./apple-icon.svg" alt="" width="23" height="29">
        <span>Chromatic</span>
      </div>
      <img class="menu-icon" src="./menu-icon.svg" alt="" width="30" height="30">
      <time>Fri Aug 20  17:30</time>
    </div>
    <header class="identity">
      <div class="brand">
        <img src="./app-icon.png" width="64" height="64" alt="">
        <h1>Chromatic</h1>
      </div>
      <p>macOS menu bar app for color contrast accessibility.</p>
    </header>
    <footer>© 2026 Andrew Gioia / <a href="https://prismatichq.com">prismatichq.com</a></footer>
  </main>
</body>
</html>
